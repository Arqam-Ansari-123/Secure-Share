# SecureShare — nginx site configuration
#
# THIS IS THE OTHER HALF OF THE PORT DEFINITION. Frontend/ecosystem.config.cjs
# says which port each static server LISTENS on; this file says which port nginx
# CONNECTS to. The numbers must match — nothing verifies it, and a mismatch
# shows up only as 502 Bad Gateway.
#
#     dist/staff   ->  127.0.0.1:4173  ->  priv.genetechsolutions.com
#     dist/public  ->  127.0.0.1:4174  ->  priv-req.genetechsolutions.com
#     backend API  ->  127.0.0.1:8000  ->  both, under /api/
#
# INSTALL
#     sudo cp deploy/nginx.conf /etc/nginx/sites-available/secureshare
#     sudo ln -s /etc/nginx/sites-available/secureshare /etc/nginx/sites-enabled/
#     sudo rm -f /etc/nginx/sites-enabled/default
#     sudo nginx -t && sudo systemctl reload nginx
#
# THEN add TLS. certbot rewrites both server blocks in place, adds the
# certificate directives and creates the HTTP -> HTTPS redirect:
#     sudo certbot --nginx -d priv-req.genetechsolutions.com -d priv.genetechsolutions.com
#
# Replace both hostnames below with your own before installing.

# ---------------------------------------------------------------------------
# Shared proxy settings for the API.
#
# BOTH forwarded headers are load-bearing:
#   X-Forwarded-For    without it every audit row records nginx's own IP and the
#                      per-IP rate limiter collapses into one global bucket.
#   X-Forwarded-Proto  without it the backend sees plain http, and
#                      HTTPSRedirectMiddleware answers every request with a
#                      redirect to https — which nginx forwards again, until the
#                      browser gives up with ERR_TOO_MANY_REDIRECTS.
# uvicorn already runs with --proxy-headers, so it trusts them.
#
# `Host $host` passes the real hostname through, which is what
# TrustedHostMiddleware validates against ALLOWED_HOSTS.
# ---------------------------------------------------------------------------

# ===========================================================================
# CLIENTS — the public surface. This hostname goes out to outside companies.
# ===========================================================================
server {
    listen 80;
    server_name priv-req.genetechsolutions.com;

    # Encrypted payloads are capped at 5 MiB by the backend; allow a little
    # headroom for the multipart envelope or large submissions 413 at nginx
    # before the backend can return its own clear error.
    client_max_body_size 8m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else: the PUBLIC bundle. It contains no staff code at all —
    # Rollup drops the staff module from this build entirely.
    location / {
        proxy_pass http://127.0.0.1:4174;      # <-- PUBLIC_PORT
        proxy_set_header Host $host;
    }
}

# ===========================================================================
# EMPLOYEES — the internal surface.
# ===========================================================================
server {
    listen 80;
    server_name priv.genetechsolutions.com;

    client_max_body_size 8m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:4173;      # <-- STAFF_PORT
        proxy_set_header Host $host;
    }

    # OPTIONAL, and worth doing once the office IP range is known. This is the
    # control that a single shared hostname could not express — restricting the
    # internal app without also blocking clients.
    #
    # location / {
    #     allow 203.0.113.0/24;   # Genetech office
    #     allow 100.64.0.0/10;    # Tailscale
    #     deny  all;
    #     proxy_pass http://127.0.0.1:4173;
    #     proxy_set_header Host $host;
    # }
}


